---
layout: default
title: Home
---

<h2>Latest Deals</h2>

{% for post in site.posts %}
    <div class="post-card">
        <h3><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h3>
        <p>{{ post.excerpt | strip_html | truncatewords: 20 }}</p>
        <a href="{{ site.baseurl }}{{ post.url }}" class="btn">Read more →</a>
    </div>
{% endfor %}
