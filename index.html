---
layout: default
title: Home
---
<header>
    <h1>{{ site.title }}</h1>
    <p>{{ site.description }}</p>
</header>

<h2>Latest Deals</h2>
{% for post in site.posts %}
    <div class="post-card">
        <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
        <p>{{ post.excerpt }}</p>
        <a href="{{ post.url }}">Read more →</a>
    </div>
{% endfor %}
