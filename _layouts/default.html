<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{{ site.baseurl }}/" class="site-title">{{ site.title }}</a>
            <nav>
                <a href="{{ site.baseurl }}/">Home</a>
            </nav>
        </div>
    </header>
    <footer class="site-footer">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}. Built for deals.</p>
    <nav class="footer-nav">
        <a href="{{ site.baseurl }}/privacy-policy">Privacy Policy</a> | 
        <a href="{{ site.baseurl }}/terms-of-service">Terms of Service</a>
    </nav>
</footer>

    <div class="container">
        {{ content }}
    </div>

   
</body>
</html>
