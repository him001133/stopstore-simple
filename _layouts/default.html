<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{{ site.baseurl }}/" class="site-title">{{ site.title }}</a>
            <nav>
                <a href="{{ site.baseurl }}/">Home</a>
                <a href="{{ site.baseurl }}/categories/">Categories</a>
                <a href="{{ site.baseurl }}/tags/">Tags</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}. Built for deals.</p>
            <nav class="footer-nav">
                <a href="{{ site.baseurl }}/privacy-policy">Privacy Policy</a> | 
                <a href="{{ site.baseurl }}/terms-of-service">Terms of Service</a>
            </nav>
        </div>
    </footer>
</body>
</html>
